<template>
    <lightning-card title="Shipment Board" icon-name="standard:shipment">
        <div slot="actions">
            <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh shipments" onclick={handleRefresh}></lightning-button-icon>
        </div>
        <div class="slds-var-p-horizontal_medium slds-grid slds-wrap slds-grid_vertical-align-end slds-var-m-bottom_small">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-p-right_small">
                <lightning-combobox label="Status" value={status} options={statusOptions} onchange={handleStatusChange}></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <lightning-input type="search" label="Search shipment or customer" onchange={handleSearch}></lightning-input>
            </div>
        </div>
        <template lwc:if={hasError}>
            <div class="slds-var-p-horizontal_medium slds-text-color_error" role="alert">{error}</div>
        </template>
        <template lwc:elseif={isEmpty}>
            <div class="slds-var-p-around_medium slds-text-color_weak">No shipments match the current filters.</div>
        </template>
        <template lwc:else>
            <div class="slds-var-p-horizontal_medium">
                <lightning-datatable key-field="id" data={rows} columns={columns} hide-checkbox-column onrowaction={handleRowAction} is-loading={isLoading}></lightning-datatable>
            </div>
        </template>
        <div slot="footer" class="slds-grid slds-grid_align-spread">
            <lightning-button label="Previous" onclick={handlePrev} disabled={disablePrev}></lightning-button>
            <lightning-button label="Next" onclick={handleNext} disabled={disableNext}></lightning-button>
        </div>
    </lightning-card>
</template>
