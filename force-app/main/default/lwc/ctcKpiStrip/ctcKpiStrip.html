<template>
    <div class="slds-grid slds-wrap slds-gutters slds-var-m-bottom_small slds-var-p-horizontal_small">
        <template lwc:if={error}>
            <div class="slds-col slds-text-color_error" role="alert">{error}</div>
        </template>
        <template for:each={kpis} for:item="kpi">
            <div key={kpi.key} class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                <div class="slds-box slds-theme_default slds-text-align_center">
                    <div class={kpi.valueClass}>{kpi.count}</div>
                    <div class="slds-text-title_caps">{kpi.label}</div>
                </div>
            </div>
        </template>
    </div>
</template>
